name: Deploy application to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: tvdmitry/Auto-parts-cross-reference-search-service/.github/workflows/pages.yml@main
